  <text x="1076" y="414" fill="#244B3D" font-family="Alexandria, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="end" direction="rtl">لوحة الألوان</text>
  <text x="1076" y="444" fill="#65766D" font-family="Alexandria, Arial, sans-serif" font-size="15" text-anchor="end" direction="rtl">درجات طبيعية تكمل شخصية العلامة</text>

