  <desc id="description">الشعار والعبارة التعريفية ولوحة ألوان أخضر شذرة النباتي والرملي الدافئ والعاجي.</desc>
  <rect width="1200" height="840" fill="#F4F0E7"/>
  <rect x="36" y="32" width="1128" height="776" rx="28" fill="#FBFAF7" stroke="#E4DED1" stroke-width="2"/>

